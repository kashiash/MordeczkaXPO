task:
  title: Reguly wygladu z dyktowania (AI) w mordeczce
  description: >-
    Do mordeczki (spolszczony XafXPODynAssem, XPO + Roslyn runtime entities, AI chat
    z function callingiem w SchemaAIToolsProvider) dochodzi mechanizm regul wygladu
    sterowanych z bazy — wzorowany na MBrekhof/XafDataDrivenConditionalApp — oraz
    narzedzie AI, ktore z dyktowanego zdania ("zrob faktury niezaplacone na czerwono
    na listach") tworzy rekord reguly: typ docelowy, kryterium, kolor, kontekst.
    Reguly dzialaja bez rekompilacji. Calosc po polsku (nazwy encji, pol, komunikatow),
    zgodnie z konwencja mordeczki. Na koniec deploy na Proxmox (LXC 200) i test.
  status: in_progress
  tags: [xaf, xpo, conditional-appearance, ai-tools, polonizacja, mordeczka]
  priority: high

