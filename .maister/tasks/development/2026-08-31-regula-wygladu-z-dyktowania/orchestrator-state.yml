  # Rozstrzygniete na bramce fazy 2 (2026-08-31)
  architecture_decision:
    decision: Wariant A — ViewController podpiety pod AppearanceController.CollectAppearanceRules
    rationale: >-
      Regula czytana z bazy przy kazdej aktywacji widoku. Dziala tak samo w Blazorze
      i WinForms bez rejestracji w Startup.cs. Propagacja na trzy repliki za darmo,
      bo nie ma globalnego cache. Wariant B mial dwie niezalezne drogi porazki:
      procesowy cache modelu aplikacji i dlugo zyjacy klient WinForms.
    obowiazkowe_konsekwencje:
      - "Straznik w handlerze: wyjatek w CollectAppearanceRules wywraca CALY widok"
      - "Regula pre-ladowana w OnActivated — NIGDY zapytanie do bazy w samym handlerze"
      - "Sekwencja bez odstepstw: ResetRulesCache() -> subskrypcja -> Refresh()"
      - "Pomijac NonPersistentObjectSpace i sprawdzac ObjectSpace.IsDisposed"

  deployment_decision:
    decision: "(b) Zgasic trojke, wdrozyc od nowa, przyjac jawna przerwe"
    rationale: Nic nowego do napisania — trzy-repliki.sh jest sprawdzony; tania i niskiego ryzyka droga na maszynie demo.
    kroki: ["docker compose down", "nowy obraz", "--updateDatabase dla nowej tabeli", "trzy-repliki.sh", "test osobno na 8101/8102/8103"]
    uwaga: "README-wdrozenie.md §1 opisuje transfer paczki 223 MB jako krok blokowany dla agenta — ten fragment wykona uzytkownik"

  scope_decisions:
    - decision: Reguly dostaja wlasny ekran (lista + szczegoly) w nawigacji
      rationale: >-
        Kompletnosc CRUD z 40% na 100%. Bez tego jedyna droga cofniecia bledu AI
        jest SQL w bazie produkcyjnej, a bledna regula dotyka wszystkich uzytkownikow
        na trzech replikach. Koszt: dwa atrybuty + uprawnienia w Updater.cs, wzorem
        WorkflowDefinition, bez tykania .xafml.
    - decision: Graduacja — ostrzezenie ORAZ migracja TargetTypeName
      rationale: >-
        GraduationService nie emituje deklaracji namespace, wiec FullName przechodzi
        z XafXPODynAssem.RuntimeEntities.X na XafXPODynAssem.Module.BusinessObjects.X
        i kazda regula cicho przestaje kolorowac. Sam fallback na nazwe krotka odrzucony —
        polskie encje runtime dziela nazwy i prefiksy.
    - decision: >-
        Graduacja NIE generuje regul jako atrybutow [Appearance] w kodzie —
        generuje wylacznie zakomentowana sekcje "--- Appearance Note ---"
      rationale: >-
        Rozwazone i odrzucone. Encja graduuje, bo jej ksztalt sie ustabilizowal;
        regula kolorowania to decyzja operacyjna, ktora zmienia sie dalej — zamrozenie
        jej w atrybucie znaczy, ze zmiana koloru wymaga przebudowy obrazu, czyli
        dokladnie tego, czego ta funkcja ma nie wymagac. Do tego [Appearance] przyjmuje
        BackColor jako konkretny string, wiec zamrozilby odcien i skasowal korzysc
        z rol semantycznych. I trzecie: regul na jedna encje jest wiele, od roznych osob,
        czesc zawezona przez ViewId — nie naleza do klasy. Sekcja-notatka jest za darmo,
        bo GenerateSource ma juz konwencje "--- XPO Note ---" / "--- Web API Note ---".
    - decision: >-
        Jeden walidator regul uzyty w trzech miejscach, a niesprawna regula jest
        WIDOCZNA jako zepsuta, nie pomijana po cichu (doprecyzowanie uzytkownika)
      rationale: >-
        We wszystkich czterech repozytoriach referencyjnych niesprawna regula po prostu
        przestaje dzialac w ciszy — uzytkownik widzi brak koloru i nie wie, czy zle napisal
        kryterium, czy funkcja nie dziala. Ten sam walidator dziala: (1) w narzedziu AI
        przed zapisem — odmawia utworzenia bubla, (2) w kontrolerze przy aktywacji widoku —
        pomija niesprawna zamiast wywalic widok, (3) na ekranie regul — POKAZUJE, ze jest
        zepsuta i dlaczego.
      wykrywane_stany:
        - "NIESPRAWNA: typ sie nie rozwiazuje (XafTypesInfo.FindTypeInfo -> null) — encja usunieta przez delete_entity albo wygraduowana i nazwa nieaktualna"
        - "NIESPRAWNA: kryterium nie parsuje — CriteriaOperator.Parse rzuca; pokazac komunikat parsera"
        - "NIESPRAWNA: kryterium wskazuje nieistniejaca wlasciwosc — obejsc drzewo po wezlach OperandProperty i sprawdzic w ITypeInfo.Members; to jest przypadek, ktory potrafi wywrocic widok"
        - "NIESPRAWNA: pole docelowe z TargetItems nie istnieje na typie"
        - "OSTRZEZENIE: pole istnieje, ale zostalo ukryte (IsVisibleInListView=false) — regula poprawna, tylko nie ma czego pokolorowac; sankcjonowana sciezka repo 'pol nie usuwamy, ukrywamy je'"
      gdzie_widac: >-
        Dwa utrwalone pola na encji — Stan (Sprawna/Ostrzezenie/Niesprawna) i Diagnoza —
        przeliczane przy zapisie reguly, przy graduacji, przy usuwaniu encji oraz akcja
        "Sprawdz reguly" na liscie. Utrwalone, zeby lista pokazywala stan bez przeliczania
        wszystkiego. Niesprawne wiersze kolorowane statycznym [Appearance] na samym ekranie
        regul — dokladnie jak CustomClass.cs:23-32 koloruje juz wygraduowane encje.
      skutek_dla_graduacji: >-
        Graduacja przestaje byc przypadkiem szczegolnym — staje sie jednym z wyzwalaczy
        przeliczenia. Migracja TargetTypeName nadal naprawia to, co da sie naprawic
        automatycznie, ale przestaje byc jedyna linia obrony.
    - decision: Kolor przez ROLE semantyczna, nie surowy ARGB (decyzja z rozmowy)
      rationale: >-
        Regula z zapisanym ARGB jest zwiazana z jedna skorka; skorka bywa per uzytkownik.
        Encja trzyma role (Blad/Ostrzezenie/Sukces/Informacja/Wyciszone/Wyroznione),
        odcien rozwiazywany przy renderowaniu. Narzedzie AI ustawia WYLACZNIE role —
        modelowi latwiej trafic w role niz w hex, a reguly z roznych rozmow wygladaja
        wtedy jak jeden system. Surowy kolor zostaje jako furtka administratora.
        Kolor tla i czcionki zawsze w parze.

