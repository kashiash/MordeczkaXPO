  # Ryzyka wniesione z przegladu przed faza 1 — do rozstrzygniecia na bramkach
  pre_analysis_risks:
    - id: deploy-brak-sciezki
      severity: blocker
      note: >-
        Wdrozenie NOWEGO obrazu na uklad trzech replik nie ma napisanej procedury
        (handoff 2026-08-31: "wymiana obrazu przy trzech replikach — zaprojektowana,
        nienapisana"), a wdroz.sh celowo odmawia startu, gdy upstream opisuje wiecej
        niz jedna replike. Decyzja uzytkownika na bramce fazy 2: (a) napisac wymiane
        calej trojki blue/green na 8111-8113, (b) zgasic trojke i wdrozyc od nowa z
        przerwa, (c) wdrozyc pojedyncza instancje testowa i odlozyc trojke.
    - id: propagacja-regul
      severity: high
      note: >-
        Reguly NIE moga wejsc do odcisku metadanych ReplicaSyncService — inaczej kazda
        podyktowana regula restartuje wszystkie trzy repliki. Jednoczesnie statyczny
        event RulesCommitted Brekhofa jest tu bezuzyteczny: trzy repliki to trzy procesy.
        Kierunek: wlasny licznik wersji regul odpytywany w tej samej petli co odcisk,
        przeladowujacy cache regul zamiast restartowac proces.
    - id: typy-runtime
      severity: high
      note: >-
        Typy sa kompilowane w locie przez Roslyn. Type.GetType na nich nie zadziala —
        uzyc XafTypesInfo.FindTypeInfo(nazwa)?.Type. Przechowywac FullName, nie
        AssemblyQualifiedName. NIE kopiowac dopasowania StartsWith (nazwy encji sa
        polskimi rzeczownikami o wspolnych prefiksach: Faktura / FakturaPozycja).
        Regula moze przezyc pole, ktore wskazuje — CollectAppearanceRules odpala sie
        per element UI, wiec niezabezpieczony wyjatek kladzie caly widok.
    - id: ugruntowanie-schematu-ai
      severity: high
      note: >-
        Trudna czesc narzedzia AI to nie deklaracja funkcji, tylko odwzorowanie
        "niezaplacone" na realne kryterium ([Zaplacona] = False? [DoZaplaty] > 0?).
        Schemat jest definiowany przez uzytkownika i sie zmienia. Walidacja przed
        zapisem: CriteriaOperator.Parse ORAZ sprawdzenie, ze kazda przywolana wlasciwosc
        istnieje na rozwiazanym ITypeInfo; blad wraca do czatu, model poprawia.
    - id: kolor-zalezny-od-skorki
      severity: high
      note: >-
        Regula zapisujaca konkretny ARGB jest zwiazana z jedna skorka na zawsze —
        jasne tlo pod ciemnym motywem daje bialy tekst na jasnym tle. Skorka bywa
        ustawiana per uzytkownik, wiec jedna globalna regula nie trafi w obie.
        Kierunek: encja trzyma ROLE koloru (Blad / Ostrzezenie / Sukces / Informacja /
        Wyciszone / Wyroznione), odcien rozwiazywany przy renderowaniu z palety
        dobranej do motywu. Surowy kolor zostaje jako opcjonalna furtka administratora,
        ale narzedzie AI ustawia WYLACZNIE role — modelowi latwiej trafic w role niz
        w hex, a reguly z roznych rozmow wygladaja wtedy jak jeden system.
        Zasada dodatkowa: kolor tla i czcionki zawsze ustawiane w parze.
        DO SPRAWDZENIA EMPIRYCZNIE (nie zakladac): (1) czy z kontrolera da sie odczytac
        aktywny motyw DevExpress Blazor i czy jest per uzytkownik czy globalny;
        (2) czy IAppearance.BackColor przenosi kanal alfa do CSS — jesli tak,
        polprzezroczyste nakladki rozwiazuja problem bez wiedzy o skorce.
    - id: gdzie-dokumentacja
      severity: medium
      note: >-
        ".maister/tasks/" to stan robocza workflow, nie dokumentacja repo. Projekt trzyma
        dokumentacje w docs/ i docs/plans/, a porownania miedzyprojektowe w
        /Users/jacek/Projects/Brekhof/notatki/. Wynik ma wyladowac takze tam —
        w szczegolnosci wiersz HIS i werdykt "wersji wspolnej" dopisany do
        notatki/ConditionalAppearance-porownanie.md.

